services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    labels:
      com.github.nginx-proxy.nginx-proxy.nginx: "true"
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - ./config/vhost.d:/etc/nginx/vhost.d:ro
      # Uncomment to enable real IP extraction from PROXY protocol headers
      # (requires ENABLE_PROXY_PROTOCOL=true, see docs/podman-macos-real-ip.md):
      - ./config/conf.d/real_ip.conf:/etc/nginx/conf.d/real_ip.conf:ro
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
    networks:
      - nginx-proxy

  docker-gen:
    image: nginxproxy/docker-gen
    container_name: nginx-proxy-gen
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      ENABLE_IPV6: ${ENABLE_IPV6:-false}
      PREFER_IPV6_NETWORK: ${PREFER_IPV6_NETWORK:-false}
      ENABLE_PROXY_PROTOCOL: ${ENABLE_PROXY_PROTOCOL:-false}
    volumes:
      - conf:/etc/nginx/conf.d
      - ./config/vhost.d:/etc/nginx/vhost.d:ro
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - ./config/nginx.tmpl:/etc/docker-gen/templates/nginx.tmpl:ro
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/tmp/docker.sock:ro
    command: -notify-sighup nginx-proxy -watch /etc/docker-gen/templates/nginx.tmpl /etc/nginx/conf.d/default.conf
    networks:
      - nginx-proxy
    privileged: true

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: unless-stopped
    user: root
    depends_on:
      - nginx
      - docker-gen
    environment:
      NGINX_DOCKER_GEN_CONTAINER: nginx-proxy-gen
      NGINX_PROXY_CONTAINER: nginx-proxy
      ACME_CHALLENGE: ${ACME_CHALLENGE:-DNS-01}
      ACMESH_DNS_API_CONFIG: |-
        DNS_API: ${ACMESH_DNS_API:-dns_cf}
        CF_Token: ${CF_TOKEN}
        CF_Account_ID: ${CF_ACCOUNT_ID}
        CF_Zone_ID: ${CF_ZONE_ID:-}
    volumes:
      - conf:/etc/nginx/conf.d
      - ./config/vhost.d:/etc/nginx/vhost.d:ro
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs
      - acme:/etc/acme.sh
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - nginx-proxy
    privileged: true

volumes:
  conf:
  html:
  certs:
  acme:

networks:
  nginx-proxy:
    name: nginx-proxy
