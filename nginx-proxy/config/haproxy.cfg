# HAProxy TCP proxy that prepends PROXY protocol v2 headers to preserve
# real client IPs before gvproxy NATs the connection to the Podman VM.
#
# Install:  brew install haproxy
# Run:      haproxy -f config/haproxy.cfg
# Service:  brew services start haproxy
#           (symlink this file to $(brew --prefix)/etc/haproxy.cfg first)

global
    log stdout format raw local0 info

defaults
    mode tcp
    option tcplog
    log global
    timeout connect 10s
    timeout client 600s
    timeout server 600s

frontend http
    bind :80
    default_backend nginx_http

frontend https
    bind :443
    default_backend nginx_https

backend nginx_http
    server nginx 127.0.0.1:8080 send-proxy-v2

backend nginx_https
    server nginx 127.0.0.1:8443 send-proxy-v2
