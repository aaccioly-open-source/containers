# Real IP extraction via PROXY protocol (proxy-wide nginx setting).
#
# Enable by uncommenting the corresponding volume mount in compose.yml when
# running behind a proxy that sends PROXY protocol headers, i.e. when
# ENABLE_PROXY_PROTOCOL=true.
#
# See docs/podman-macos-real-ip.md for the full macOS/Podman Desktop setup.

# Trusted upstream proxy CIDR ranges — adjust to match your actual proxy.
# RFC 1918 private ranges cover Docker/Podman container and VM networks.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fd00::/8;

# Read the client IP from the PROXY protocol header instead of the TCP source.
real_ip_header proxy_protocol;
